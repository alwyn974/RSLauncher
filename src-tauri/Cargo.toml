[package]
name = "RSLauncher"
version = "0.1.6"
description = "A Tauri App"
authors = ["Alwyn974"]
license = ""
repository = "https://github.com/alwyn974/RSLauncher"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rslauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Compile-time knobs (https://nnethercote.github.io/perf-book/build-configuration.html).
# Do NOT set codegen-units=1 / fat LTO here — they crush CI/link times for little gain on a Tauri launcher.
[profile.dev]
# Keep panic line info, skip full debugger info (~20–40% faster local rebuilds).
debug = "line-tables-only"

[profile.release]
# Default thin-local LTO stays on (lto = false). Strip speeds linking a bit + smaller NSIS.
strip = "symbols"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-log = "2.9.0"
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
include_dir = "0.7.4"
log = "0.4.33"

# `tracing` enables Lighty's trace_* macros; its `log` feature forwards them
# into the `log` facade that tauri-plugin-log installs (no tracing-subscriber).
# `all-loaders` only enables loader *metadata* (lighty-loaders/*). NeoForge/Forge
# install processors live behind lighty-launch/{neoforge,forge} — without those,
# the game launches with vanilla classpath and every mod reports neoforge/minecraft
# as [MISSING].
lighty-launcher = { version = "26.5.12", features = ["all-loaders", "neoforge", "forge", "lighty_updater", "all-mods", "events", "keyring", "tracing"] }
# `sync` for modpack_meta; `rt` to block_on the GitHub modpacks.toml fetch at startup.
tokio = { version = "1.53.1", default-features = false, features = ["sync", "rt"] }
thiserror = "2.0.19"
keyring = "4.1.6"
fastnbt = "2.6.2"
flate2 = "1.1.9"
sysinfo = "0.39.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Generated by scripts/apply-patches.sh from patches/*.patch (gitignored under patched/).
# Remove once upstream Lighty ships the ForgeCDN downloadUrl fallback.
[patch.crates-io]
lighty-modsloader = { path = "./patched/lighty-modsloader-26.5.12" }
lighty-launch = { path = "./patched/lighty-launch-26.5.12" }
lighty-java = { path = "./patched/lighty-java-26.5.12" }
