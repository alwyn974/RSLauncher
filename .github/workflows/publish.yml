name: Publish Action

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          #          - platform: ubuntu-latest
          #            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      node-version: 26.x
      # Updater signatures (pair with pubkey in src-tauri/tauri.conf.json)
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Baked into the binary by src-tauri/build.rs
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require signing + bake secrets
        shell: bash
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY CURSEFORGE_API_KEY AZURE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # tauri-action's __VERSION__ comes from package/tauri.conf - NOT from the
      # git tag. If you tag v0.1.1 while the project still says 0.1.0, it
      # overwrites the v0.1.0 GitHub release. Sync (or verify) first.
      - name: Sync version from git tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semver version (expected vX.Y.Z)"
            exit 1
          fi

          echo "Publishing tag $TAG → app version $VERSION"

          # package.json
          tmp="$(mktemp)"
          jq --arg v "$VERSION" '.version = $v' package.json >"$tmp"
          mv "$tmp" package.json

          # tauri.conf.json
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json >"$tmp"
          mv "$tmp" src-tauri/tauri.conf.json

          # Cargo.toml [package].version (first occurrence only)
          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$VERSION\"/}" src-tauri/Cargo.toml

          echo "package.json → $(jq -r .version package.json)"
          echo "tauri.conf.json → $(jq -r .version src-tauri/tauri.conf.json)"
          echo "Cargo.toml → $(awk '/^version = /{print $3; exit}' src-tauri/Cargo.toml)"

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # ratchet:pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ env.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Stable across jobs/tags — restore from caches saved on `main`
          # (see cache.yml). Tag-scoped saves are useless to other tags.
          shared-key: rslauncher-windows
          workspaces: "./src-tauri -> target"
          cache-all-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Prefer the pushed git tag so each release is a new GitHub Release.
          # Falls back to project version for workflow_dispatch on a branch.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ github.ref_type == 'tag' && format('RSLauncher {0}', github.ref_name) || 'RSLauncher v__VERSION__' }}
          releaseBody: "RSLauncher — download the installer below."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # Uses package.json "tauri" script → applies Lighty patches first.
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
