name: Publish Action

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
#          - platform: ubuntu-latest
#            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      node-version: 26.x
      # Updater signatures (pair with pubkey in src-tauri/tauri.conf.json)
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Baked into the binary by src-tauri/build.rs
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require signing + bake secrets
        shell: bash
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY CURSEFORGE_API_KEY AZURE_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret/env: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # ratchet:pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ env.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.node-version }}
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Must match push tags `v*` and the updater endpoint
          # (…/releases/latest/download/latest.json).
          tagName: v__VERSION__
          releaseName: "RSLauncher v__VERSION__"
          releaseBody: "RSLauncher v__VERSION__ — download the installer below."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # Uses package.json "tauri" script → applies Lighty patches first.
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
