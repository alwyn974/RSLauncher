# Populate GitHub Actions caches on `main` so tag/publish runs can restore them.
# Caches created on tags are NOT visible to other tags - only default-branch
# caches are (GitHub scoping). Keep `shared-key` in sync with publish.yml.
name: Cache

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cache.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

concurrency:
  group: cache-main
  cancel-in-progress: true

jobs:
  warm-windows:
    runs-on: windows-latest
    env:
      node-version: 26.x
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      # Needed so `tauri build` can produce updater artifacts like publish does.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # ratchet:pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js ${{ env.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.node-version }}
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          # Must match publish.yml exactly.
          shared-key: rslauncher-windows
          workspaces: "./src-tauri -> target"
          cache-all-crates: true
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      - name: Release build (warm compile cache)
        # Full tauri build matches publish compile units better than cargo check.
        # No GitHub release - cache only.
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        run: pnpm tauri build
